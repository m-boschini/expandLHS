name: docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  jupyter:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - run: brew install pandoc
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: pip install ipykernel
    - run: pip install nb2plots
    - name: convert
      run: |
        cd examples
        jupyter nbconvert --to notebook --execute LHS_examples.ipynb
        nb2plots LHS_examples.nbconvert.ipynb > example.rst
    - uses: actions/upload-artifact@v4
      with:
        name: example.rst
        path: examples/example.rst


  builddocs:
    needs: jupyter
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: example.rst
        path: docs
    - uses: BrianJKoopman/sphinx-action@master
      with:
        build-command: "make html"
        docs-folder: "docs/"
    - name: Commit documentation changes
      run: |
        git clone http://github.com/m-boschini/expandLHS.git --branch gh-pages --single-branch gh-pages
        cp -r docs/_build/html/* gh-pages/
        cd gh-pages
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "Update documentation" -a || true
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        branch: gh-pages
        directory: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: geekyeggo/delete-artifact@v4
      with:
        name: example.rst
